<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Satürn'e Mesaj Var 🪐</title>
    <style>
        /* Google Fontları */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Pacifico&display=swap');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Kaydırma çubuklarını gizle */
            background: radial-gradient(circle at center, #1a0b2e, #000000);
            font-family: 'Orbitron', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Arka Plan Yıldızları */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Ana Kutu Tasarımı */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(123, 31, 162, 0.6);
            max-width: 90%;
            width: 400px;
            z-index: 10;
            position: relative;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #e0b0ff;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #e0b0ff;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .planet-icon {
            font-size: 5rem;
            display: block;
            margin: 0 auto 20px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Butonlar */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            height: 60px; /* Buton kaçarken düzen bozulmasın diye */
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: 0.3s;
            outline: none;
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff0099, #493240);
            color: white;
            box-shadow: 0 0 15px #ff0099;
            z-index: 2;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px #ff0099;
        }

        #noBtn {
            background: #555;
            color: #ccc;
            position: relative; /* JavaScript ile absolute olacak */
            z-index: 1;
        }

        /* Gizli Mesaj */
        #success {
            display: none;
        }

        /* Kalp Animasyonu */
        .heart {
            position: fixed;
            color: #ff0055;
            font-size: 2rem;
            animation: rise 4s linear forwards;
            z-index: 100;
        }

        @keyframes rise {
            to { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="card" id="questionCard">
        <div class="planet-icon">🪐</div>
        <h1>Hey Aleyna!</h1>
        <p>
            Uzay boşluğunda süzülürken radarıma takılan en güzel şeysin.<br><br>
            Benim <b>Valentine'ım</b> (Sevgilim) olur musun <b>Süper Satürn?</b> 🚀❤️
        </p>
        
        <div class="btn-group">
            <button id="yesBtn" onclick="sheSaidYes()">EVET!</button>
            <button id="noBtn" onmouseover="kac()" ontouchstart="kac()">Hayır</button>
        </div>
    </div>

    <div class="card" id="success">
        <div class="planet-icon">👩‍🚀❤️👨‍🚀</div>
        <h1>Yeyyy! 🥳</h1>
        <p>
            Biliyordum! Yer çekimine karşı koyamazsın. <br>
            Seni seviyorum Süper Satürn'üm! <br><br>
            (Zaten 'Hayır' tuşu bozuktu şşşt 😉)
        </p>
    </div>

    <script>
        // Yıldızları oluştur
        const starsContainer = document.getElementById('stars');
        for(let i=0; i<100; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
            starsContainer.appendChild(star);
        }

        // Kaçan Buton Fonksiyonu
        const noBtn = document.getElementById('noBtn');
        const phrases = ["Yakalayamazsın!", "Ciddi misin?", "O tuş bozuk!", "Hadi canım!", "İmkansız!", "Dene Bakalım!"];

        function kac() {
            // Ekran sınırlarını al
            const maxX = window.innerWidth - 100;
            const maxY = window.innerHeight - 50;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            // Butonu yeni konuma taşı
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            
            // Rengini ve yazısını değiştir
            noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            noBtn.style.background = "#ff4444";
            noBtn.style.color = "white";
        }

        // Evet denilince
        function sheSaidYes() {
            document.getElementById('questionCard').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            startConfetti();
        }

        // Kalp Yağmuru
        function startConfetti() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = Math.random() * 30 + 10 + 'px';
                document.body.appendChild(heart);
                
                setTimeout(() => heart.remove(), 4000);
            }, 100);
        }
    </script>
</body>
</html>
